name: Supabase Keep Alive

on:
  schedule:
    # Se ejecuta cada 3 días a las 09:00 AM UTC (para asegurar que nunca se pause)
    - cron: '0 9 */3 * *'
  workflow_dispatch: # Permite ejecutar manualmente desde la interfaz de GitHub

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase REST API
        run: |
          curl -s -X GET "https://ykchpbqkjvmnddndkvno.supabase.co/rest/v1/vigilantes?select=id&limit=1" \
            -H "apikey: sb_publishable_OlEXiywU13_j1FlB4QZWLQ_kYI41a-E" \
            -H "Authorization: Bearer sb_publishable_OlEXiywU13_j1FlB4QZWLQ_kYI41a-E"
          echo "Keep Alive ping sent successfully."
