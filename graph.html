    const visNodes = graphData.nodes.map(n => {
      const colorMap = {"page":"#3b82f6","component":"#10b981","store":"#8b5cf6","hook":"#f59e0b","util":"#64748b","other":"#94a3b8"};
      return {
        id: n.id,
        label: n.label,
        category: n.category,
        title: n.id,
        value: Math.max(5, n.degree * 2),
        color: {
          background: colorMap[n.category] || "#94a3b8",
          border: "#ffffff",
          highlight: { background: "#f43f5e", border: "#ffffff" }
        },
        font: { color: "#ffffff", size: 12, face: "Plus Jakarta Sans", strokeWidth: 3, strokeColor: "#020617" },
        shape: n.category === "store" ? "diamond" : (n.category === "page" ? "box" : "dot"),
        data: n
      };
    });

    const visEdges = graphData.edges.map(e => ({
      from: e.from,
      to: e.to,
      arrows: "to",
      color: { color: "#334155", highlight: "#f43f5e" },
      width: 1
    }));

    const container = document.getElementById("mynetwork");
    const data = { nodes: new vis.DataSet(visNodes), edges: new vis.DataSet(visEdges) };
    const options = {
      nodes: {
        borderWidth: 2,
        shadow: true
      },
      edges: {
        smooth: { type: "continuous" }
      },
      physics: {
        solver: "forceAtlas2Based",
        forceAtlas2Based: {
          gravitationalConstant: -50,
          centralGravity: 0.01,
          springLength: 100,
          springConstant: 0.08
        },
        maxVelocity: 50,
        minVelocity: 0.1
      },
      interaction: { hover: true, tooltipDelay: 100 }
    };

    const network = new vis.Network(container, data, options);

    network.on("click", function(params) {
      if (params.nodes.length > 0) {
        const nodeId = params.nodes[0];
        const node = graphData.nodes.find(n => n.id === nodeId);
        if (node) showDetails(node);
      } else {
        closePanel();
      }
    });

    function showDetails(node) {
      document.getElementById("detailPanel").classList.remove("hidden");
      document.getElementById("detailPanel").classList.add("flex");
      document.getElementById("nodeTitle").innerText = node.label;
      document.getElementById("nodePath").innerText = node.id;
      document.getElementById("nodeCategory").innerText = node.category.toUpperCase();
      document.getElementById("nodeDegree").innerText = node.degree;
      document.getElementById("nodeLines").innerText = node.lineCount;

      const importsUl = document.getElementById("nodeImports");
      importsUl.innerHTML = node.imports.length > 0 
        ? node.imports.map(i => `<li class="hover:text-indigo-400 cursor-pointer" onclick="selectNode('` + i + `')">• ` + i + `</li>`).join("")
        : '<li class="text-slate-600">Ninguno</li>';

      const importedByUl = document.getElementById("nodeImportedBy");
      importedByUl.innerHTML = node.importedBy.length > 0
        ? node.importedBy.map(i => `<li class="hover:text-indigo-400 cursor-pointer" onclick="selectNode('` + i + `')">• ` + i + `</li>`).join("")
        : '<li class="text-slate-600">Ninguno</li>';
    }

    function selectNode(id) {
      network.selectNodes([id]);
      const node = graphData.nodes.find(n => n.id === id);
      if (node) showDetails(node);
    }

    function closePanel() {
      document.getElementById("detailPanel").classList.add("hidden");
      document.getElementById("detailPanel").classList.remove("flex");
    }

    function fitGraph() {
      network.fit({ animation: { duration: 800, easingFunction: "easeInOutQuad" } });
    }

    document.getElementById("searchInput").addEventListener("input", function(e) {
      const q = e.target.value.toLowerCase().trim();
      if (!q) return;
      const found = graphData.nodes.find(n => n.id.toLowerCase().includes(q) || n.label.toLowerCase().includes(q));
      if (found) {
        network.selectNodes([found.id]);
        network.focus(found.id, { scale: 1.2, animation: true });
        showDetails(found);
      }
    });
  </script>
